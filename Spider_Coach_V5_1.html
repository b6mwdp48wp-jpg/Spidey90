<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:620px;margin:auto;padding:14px 14px 48px}.hero{background:#111827;color:#fff;border-radius:24px;padding:20px;margin-bottom:12px}
.hero h1{margin:4px 0;font-size:29px}.muted{color:#6b7280;font-size:13px}.hero .muted{color:#cbd5e1}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
button{border:0;border-radius:12px;padding:11px 12px;font-weight:750;background:#fff;color:#111827;box-shadow:0 1px 3px #0001}
.active{background:#111827;color:#fff}.tabs{display:flex;gap:7px;overflow:auto;margin:3px 0 9px}.tabs button{white-space:nowrap}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}
h2{font-size:18px;margin:0 0 4px}.ex{border-top:1px solid #e5e7eb;padding:14px 0}.ex:first-child{border-top:0}
.exrow{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.sets{font-size:13px;color:#6b7280;margin-top:3px}.tip{font-size:12px;color:#4b5563;margin-top:5px}
.check{width:42px;height:42px;padding:0;border-radius:50%;font-size:18px}.done{background:#16a34a;color:#fff}
.inputs{display:flex;gap:7px;margin-top:8px}.inputs input{width:100%;padding:9px;border:1px solid #ddd;border-radius:10px;font:inherit}
.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#16a34a}
.big{width:100%;background:#111827;color:#fff;margin-top:10px}.timer{text-align:center;font-size:46px;font-weight:850;margin:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f9fafb;border-radius:14px;padding:12px;margin:5px 0}
.danger{background:#fee2e2;color:#991b1b}.small{font-size:12px;color:#6b7280}.smallbtn{margin-top:7px;padding:7px 9px;font-size:12px;background:#f3f4f6;box-shadow:none}

.chart{display:flex;align-items:end;gap:6px;height:110px;padding:12px 0}
.chart div{flex:1;min-width:8px;background:#111827;border-radius:5px 5px 2px 2px}
.hero{text-align:center;padding:12px 4px 18px}
.hero h1{font-size:32px;margin:4px 0}
.hero p{margin:4px 0;color:#6b7280}
.badge{font-size:42px}
.big{width:100%;margin:6px 0}
.smallbtn{margin-top:7px;padding:7px 9px;font-size:12px;background:#f3f4f6;box-shadow:none}
.stat{padding:10px 0;border-bottom:1px solid #e5e7eb}
.stat:last-child{border-bottom:0}
.danger{background:#fee2e2;color:#991b1b;margin-top:10px}



.visualHero{margin:10px 0 12px;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px #0002}
.visualHero img{display:block;width:100%;height:auto}
.sectionImage{border-radius:18px;overflow:hidden;margin:8px 0 12px}
.sectionImage img{display:block;width:100%;height:auto}
</style>
</head>

function st(){return JSON.parse(localStorage.getItem(LS+"state")||'{"sessions":[],"prs":{},"runs":[],"ach":{},"weight":[]}')}
function ss(s){localStorage.setItem(LS+"state",JSON.stringify(s))}
function key(){return plan+"|"+day}
function wd(){return JSON.parse(localStorage.getItem(LS+"w|"+key())||"{}")}
function sw(d){localStorage.setItem(LS+"w|"+key(),JSON.stringify(d))}
function streak(){
  let ds=[...new Set(st().sessions.map(x=>x.date))].sort().reverse(), n=0, base=new Date();
  base.setHours(0,0,0,0);
  for(const x of ds){let q=new Date(x);q.setHours(0,0,0,0);let diff=Math.round((base-q)/86400000);
    if(diff===n)n++; else if(n===0&&diff===1){n=2;base=q}else break;}
  return n;
}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function nav(){

}

function training(){
  let w=P[plan][day],d=wd(),done=d.done||[],s=st();

  w.e.forEach((e,i)=>{
    let ok=done.includes(i),l=d["l"+i]||["",""],pr=s.prs[key()+"|"+i]||{};
    h+=`<div class="ex"><div class="exrow"><div style="flex:1"><div class="name">${e[0]}</div><div class="sets">${e[1]}</div>${e[2]?`<div class="tip">💡 ${e[2]}</div>`:""}

    ${pr.reps||pr.kg?`<div class="small">🏆 Best: ${pr.reps?pr.reps+" Wdh. ":""}${pr.kg?pr.kg+" kg":""}</div>`:""}</div>
    <button class="check ${ok?'done':''}" onclick="toggle(${i})">${ok?'✓':'○'}</button></div>${ok?`<button class="smallbtn" onclick="start(rest)">⏱️ ${rest}s Pause</button>`:""}</div>`;

  h+=`</div><div class="card"><h2>⏱️ Pausentimer</h2><div class="timer" id="timer">${fmtTime(timer)}</div><button onclick="start(60)">60 s</button> <button onclick="start(90)">90 s</button> <button onclick="start(120)">120 s</button></div>
  <div class="card"><button class="big" onclick="finish()">✅ Training abschließen</button></div>`;
  document.getElementById("app").innerHTML=h;
}

function saveLog(i,j,v){
 let d=wd(),a=d["l"+i]||["",""];a[j]=v;d["l"+i]=a;sw(d);
 let s=st(),k=key()+"|"+i,p=s.prs[k]||{},n=parseFloat(v);

}

 <div class="card"><h2>⚖️ Gewicht</h2><input id="weight" inputmode="decimal" type="number" step=".1" placeholder="z. B. 67.0 kg"><button onclick="saveWeight()">Gewicht speichern</button>${hist?`<div class="small">Letztes: ${s.weight[s.weight.length-1].kg} kg · niedrigstes gespeichert: ${minW||"–"} kg</div>${s.weight.length>=2?`<div class="chart">${weightChart(s.weight)}</div>`:""}:`<p class="muted">Noch keine Gewichtsdaten.</p>`}</div>
 <div class="card"><h2>🏆 Bestleistungen</h2>${prs||'<p class="muted">Noch keine Bestleistungen.</p>'}</div>

 <div class="card"><h2>🗓️ Trainingshistorie</h2>${s.sessions.slice().reverse().slice(0,30).map(x=>`<div class="stat"><b>${x.date}</b> · ${x.title}<br><span class="muted">${x.plan} · ${x.done}/${x.total} Übungen · ${x.time}</span></div>`).join("")||'<p class="muted">Noch keine abgeschlossenen Trainings.</p>'}</div>`;
}
function weightChart(a){
 let vals=a.slice(-10),mn=Math.min(...vals.map(x=>+x.kg)),mx=Math.max(...vals.map(x=>+x.kg)),r=Math.max(0.1,mx-mn);
 return vals.map(x=>`<div title="${x.date}: ${x.kg} kg" style="height:${18+((+x.kg-mn)/r)*70}px"></div>`).join("");
}
function saveWeight(){let n=parseFloat(document.getElementById("weight").value);if(!n)return;let s=st();s.weight.push({date:today(),kg:n});ss(s);award("weight","Gewicht getrackt","Dein erstes Gewicht gespeichert ⚖️");render()}

function setRunPlan(n){
 const p={1:{title:"Einsteiger",j:120,g:60,rounds:8,total:"24 min",desc:"2:00 Joggen · 1:00 Gehen · 8 Intervalle"},2:{title:"Aufbau",j:150,g:60,rounds:8,total:"28 min",desc:"2:30 Joggen · 1:00 Gehen · 8 Intervalle"},3:{title:"Locker",j:90,g:90,rounds:8,total:"24 min",desc:"1:30 Joggen · 1:30 Gehen · 8 Intervalle"}}[n];
 window.currentRunPlan=p;
 for(let i=1;i<=3;i++){let e=document.getElementById("r"+i);if(e)e.className=i===n?"active":""}
 let e=document.getElementById("runPlan");if(e)e.innerHTML=`<div class="stat"><b>${p.title}</b><br><span class="muted">${p.desc}</span><br><span class="small">Gesamtdauer: ca. ${p.total}</span></div>`;
}
function runInterval(){
 clearInterval(iv);const p=window.currentRunPlan||{j:120,g:60,rounds:8};let phase="jog",left=p.rounds*2;timer=p.j;show();
 iv=setInterval(()=>{timer--;show();if(timer<=0){if(phase==="jog"){phase="walk";timer=p.g}else{left--;if(left<=0){clearInterval(iv);navigator.vibrate?.([300,100,300]);alert("Lauftraining beendet! 🏃");return}phase="jog";timer=p.j}show()}},1000);
}
function logRun(){
 let s=st(),n=prompt("Wie viele Minuten bist du gelaufen/gegangen?","24");if(!n)return;
 let note=prompt("Wie war dein Knie?","schmerzfrei");s.runs.push({date:today(),minutes:n,note:note||"nicht angegeben"});ss(s);award("run","Erster Lauf","Ersten Lauf gespeichert 🏃");render();
}
function more(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>⚙️ Einstellungen</h2><div class="stat"><b>Standard-Pause</b><br><button onclick="setRest(60)">60 s</button> <button onclick="setRest(90)">90 s</button> <button onclick="setRest(120)">120 s</button><div class="small">Aktuell: ${rest} s</div></div>
 <div class="stat"><b>💾 Backup</b><br><button onclick="exportData()">Daten exportieren</button><button onclick="importData()">Daten importieren</button><p class="small">Export ist eine JSON-Datei. Damit kannst du deine Trainingsdaten sichern.</p></div>
 <div class="stat"><b>📱 Installation</b><br><span class="muted">Safari → Teilen → „Zum Home-Bildschirm“. Dann fühlt sich Spider Coach wie eine kleine App an.</span></div>
 <button class="danger" onclick="if(confirm('Alle Spider-Coach-Daten löschen?')){Object.keys(localStorage).filter(x=>x.startsWith('spider-v3-')).forEach(x=>localStorage.removeItem(x));location.reload()}">Alle V3-Daten löschen</button></div>`;
}
function setRest(x){rest=x;localStorage.setItem(LS+"rest",x);render()}
function exportData(){
 let blob=new Blob([JSON.stringify(st(),null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="spider-coach-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
}
function importData(){
 let i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{ss(JSON.parse(r.result));alert("Backup importiert!");render()}catch(e){alert("Backup konnte nicht gelesen werden.")}};r.readAsText(f)};i.click()
}
function start(s){clearInterval(iv);timer=s;show();iv=setInterval(()=>{timer--;show();if(timer<=0){clearInterval(iv);navigator.vibrate?.([250,100,250]);alert("Zeit vorbei! 💪")}},1000)}
function show(){let e=document.getElementById("timer");if(e)e.textContent=fmtTime(timer)}
render();
